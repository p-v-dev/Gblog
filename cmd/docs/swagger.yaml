basePath: /api/v1
definitions:
  blogPost.CreatePostInputDTO:
    properties:
      content:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      user_id:
        type: string
    type: object
  blogPost.PostOutput:
    properties:
      content:
        type: string
      content_html:
        type: string
      created_at:
        type: string
      id:
        type: string
      slug:
        type: string
      status:
        type: string
      tags:
        items:
          $ref: '#/definitions/tag.TagOutput'
        type: array
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  blogPost.UpdatePostInputDTO:
    properties:
      content:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  comment.CommentOutput:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      post_id:
        type: string
      user_id:
        type: string
    type: object
  comment.CreateCommentInput:
    properties:
      content:
        type: string
    type: object
  tag.CreateTagInput:
    properties:
      name:
        type: string
    type: object
  tag.TagOutput:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  user.CreateUserInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  user.UpdateUserInput:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  user.UserOutput:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API de gerenciamento de artigos de um blog usando Clean Architecture.
  title: Gblog API
  version: "1.0"
paths:
  /comments/{id}:
    delete:
      description: Remove o comentário (apenas o autor pode deletar)
      parameters:
      - description: ID do comentário
        in: path
        name: id
        required: true
        type: string
      - description: Bearer {token}
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deletar comentário
      tags:
      - comments
  /posts:
    get:
      description: Retorna posts publicados com paginação
      parameters:
      - description: Limite (1-100, padrão 10)
        in: query
        name: limit
        type: integer
      - description: Deslocamento (padrão 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/blogPost.PostOutput'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar posts publicados
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Cria um novo post no blog salvando-o inicialmente como rascunho
        (draft).
      parameters:
      - description: Dados para a criação do Post
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/blogPost.CreatePostInputDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Post criado com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: JSON inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Erro de regra de negócio
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar um Blog Post
      tags:
      - posts
  /posts/{id}:
    delete:
      consumes:
      - application/json
      description: Inativa um post do sistema realizando uma exclusão lógica (soft
        delete).
      parameters:
      - description: ID do Post (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Post removido com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID inválido ou post não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deletar um Blog Post
      tags:
      - posts
    put:
      consumes:
      - application/json
      description: Atualiza o título, slug e conteúdo de um post ativo.
      parameters:
      - description: ID do Post (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Novos dados do Post
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/blogPost.UpdatePostInputDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Post atualizado com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID ou JSON inválido
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Editar um Blog Post
      tags:
      - posts
  /posts/{id}/comments:
    get:
      description: Retorna todos os comentários ativos de um post
      parameters:
      - description: ID do post
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/comment.CommentOutput'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar comentários de um post
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Adiciona um comentário a um post
      parameters:
      - description: ID do post
        in: path
        name: id
        required: true
        type: string
      - description: Conteúdo do comentário
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/comment.CreateCommentInput'
      - description: Bearer {token}
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/comment.CommentOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar comentário
      tags:
      - comments
  /posts/{id}/publish:
    patch:
      consumes:
      - application/json
      description: Altera o status de um post existente para 'published' se ele cumprir
        os requisitos de negócio.
      parameters:
      - description: ID do Post (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Post publicado com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID inválido ou erro na publicação
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Publicar um Blog Post
      tags:
      - posts
  /posts/slug/{slug}:
    get:
      description: Retorna um post publicado pelo slug
      parameters:
      - description: Slug do post
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/blogPost.PostOutput'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Buscar post por slug
      tags:
      - posts
  /tags:
    get:
      description: Retorna todas as tags cadastradas
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tag.TagOutput'
            type: array
      summary: Listar tags
      tags:
      - tags
    post:
      consumes:
      - application/json
      description: Cria uma nova tag ou retorna a existente se o nome já existir
      parameters:
      - description: Nome da tag
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/tag.CreateTagInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tag.TagOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar uma tag
      tags:
      - tags
  /users:
    post:
      consumes:
      - application/json
      description: Cria um novo usuário no sistema
      parameters:
      - description: Dados do usuário
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.UserOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar um usuário
      tags:
      - users
  /users/{id}:
    delete:
      description: Realiza a exclusão lógica (soft delete) de um usuário
      parameters:
      - description: ID do usuário (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Desativar conta de usuário
      tags:
      - users
    get:
      description: Retorna informações públicas de um usuário
      parameters:
      - description: ID do usuário (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserOutput'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Buscar usuário por ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Atualiza nome e/ou email de um usuário ativo
      parameters:
      - description: ID do usuário (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Atualizar perfil do usuário
      tags:
      - users
swagger: "2.0"
